<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC813 週會中心</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* 外層：滿版視窗，用來置中縮放容器 */
  html, body {
    width: 100%; height: 100%;
    background: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 固定 1920x1080 的設計畫布，由 JS 等比例縮放 */
  #slide {
    width: 1920px;
    height: 1080px;
    background: #f1f5f9;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    flex-shrink: 0;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 64px;
  }
  .header .eyebrow {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #94a3b8;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 72px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .header .date {
    font-size: 18px;
    color: #64748b;
    margin-top: 12px;
    font-weight: 400;
  }

  /* ── Cards ── */
  .cards { display: flex; gap: 40px; }

  .card {
    width: 520px;
    background: #ffffff;
    border-radius: 24px;
    padding: 52px 48px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 24px rgba(0,0,0,.07);
    border: 2px solid transparent;
    transition: transform .2s, box-shadow .2s, border-color .2s;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 40px rgba(0,0,0,.12);
  }
  .card.blue:hover   { border-color: #2563eb; }
  .card.green:hover  { border-color: #16a34a; }
  .card.orange:hover { border-color: #E8501A; }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
  }
  .card.blue::before   { background: linear-gradient(90deg, #2563eb, #60a5fa); }
  .card.green::before  { background: linear-gradient(90deg, #16a34a, #4ade80); }
  .card.orange::before { background: linear-gradient(90deg, #E8501A, #F5821F); }

  .card .icon {
    width: 64px; height: 64px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin-bottom: 28px;
  }
  .card.blue   .icon { background: #eff6ff; }
  .card.green  .icon { background: #f0fdf4; }
  .card.orange .icon { background: #fff4ee; }

  .card .tag {
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .card.blue   .tag { color: #2563eb; }
  .card.green  .tag { color: #16a34a; }
  .card.orange .tag { color: #E8501A; }

  .card h2 {
    font-size: 28px; font-weight: 800;
    color: #0f172a; line-height: 1.3;
    margin-bottom: 16px;
  }
  .card p {
    font-size: 16px; color: #64748b; line-height: 1.6;
  }

  .card .arrow {
    position: absolute; bottom: 48px; right: 48px;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: transform .2s;
  }
  .card.blue   .arrow { background: #eff6ff; color: #2563eb; }
  .card.green  .arrow { background: #f0fdf4; color: #16a34a; }
  .card.orange .arrow { background: #fff4ee; color: #E8501A; }
  .card:hover .arrow { transform: translateX(4px); }

  /* ── Footer ── */
  .footer {
    margin-top: 52px;
    font-size: 14px; color: #cbd5e1; letter-spacing: .5px;
  }
</style>
</head>
<body>

<div id="slide">

  <div class="header">
    <div class="eyebrow">TC813 · 週會資料中心</div>
    <h1>業績追蹤看板</h1>
    <div class="date" id="today-date"></div>
  </div>

  <div class="cards">

    <a class="card blue" href="weekly-bonus.html">
      <div class="icon">📊</div>
      <div class="tag">每週更新</div>
      <h2>週會<br>季獎金跟進</h2>
      <p>各業務員季獎金達成進度<br>級距缺口與試算獎金即時追蹤</p>
      <div class="arrow">→</div>
    </a>

    <a class="card green" href="tc813-bonus-2025q1.html">
      <div class="icon">🏆</div>
      <div class="tag">115 年 1 月</div>
      <h2>特定商品<br>保費獎勵</h2>
      <p>115 年 1 月特定商品保費獎勵<br>業績結算與獎金試算總覽</p>
      <div class="arrow">→</div>
    </a>

    <a class="card orange" href="115q2-competition.html">
      <div class="icon">🎯</div>
      <div class="tag">115 年第二季</div>
      <h2>競賽獎勵<br>懶人包</h2>
      <p>FYC 達標／超標／高標獎金一覽<br>FYP 競賽獎勵說明</p>
      <div class="arrow">→</div>
    </a>

  </div>

  <div class="footer">TC813 · 資料僅供內部參考，實際金額以業務行政部核算為準</div>

</div>

<script>
  // 民國日期
  const d = new Date();
  const y = d.getFullYear() - 1911;
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('today-date').textContent =
    `${y} 年 ${m} 月 ${day} 日（週${weekdays[d.getDay()]}）`;

  // 等比例縮放：維持 1920x1080，填滿視窗
  function scaleSlide() {
    const slide = document.getElementById('slide');
    const scaleX = window.innerWidth  / 1920;
    const scaleY = window.innerHeight / 1080;
    const scale  = Math.min(scaleX, scaleY);
    slide.style.transform = `scale(${scale})`;
  }

  scaleSlide();
  window.addEventListener('resize', scaleSlide);
</script>

</body>
</html>
